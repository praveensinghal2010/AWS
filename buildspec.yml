version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Installing Chrome and dependencies
      - apt-get update
      - apt-get install -y wget gnupg xvfb
      - wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
      - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
      - apt-get update
      - apt-get install -y google-chrome-stable

  pre_build:
    commands:
      - echo Starting virtual display for headless browser
      - export DISPLAY=:99
      - Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
      - echo Build started on `date`

  build:
    commands:
      - echo Running Selenium tests
      - mvn clean test -Dwebdriver.chrome.driver=/usr/bin/google-chrome

  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - target/surefire-reports/**/*
    - target/cucumber-reports/**/*
  name: selenium-test-results-$(date +%Y-%m-%d)

reports:
  surefire-reports:
    files:
      - target/surefire-reports/*.xml
    file-format: JUNITXML
